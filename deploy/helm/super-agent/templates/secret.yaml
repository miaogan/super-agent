{{/* 敏感配置进 Secret；支持复用已存在 Secret（secret.existingSecret） */}}
{{- if not .Values.secret.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "super-agent.secretFullname" . }}
  labels:
    {{- include "super-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secret.jwtSecret | quote }}
  OPENAI_API_KEY: {{ .Values.secret.openaiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secret.anthropicApiKey | quote }}
  {{- with .Values.secret.embeddingApiKey }}
  EMBEDDING_API_KEY: {{ . | quote }}
  {{- end }}
  OPENSANDBOX_API_KEY: {{ .Values.secret.opensandboxApiKey | quote }}
  {{- with .Values.secret.ragApiKey }}
  RAG_API_KEY: {{ . | quote }}
  {{- end }}
{{- end -}}
