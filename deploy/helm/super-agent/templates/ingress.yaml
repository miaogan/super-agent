{{/* Ingress：单域名路由，按 path 路由到 frontend 或 backend */}}
{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io
kind: Ingress
metadata:
  name: {{ include "super-agent.fullname" . }}
  labels:
    {{- include "super-agent.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ if eq .service "backend" }}{{ include "super-agent.backendFullname" $ }}{{ else }}{{ include "super-agent.frontendFullname" $ }}{{ end }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end -}}
