services:
  # PostgreSQL：多轮对话（checkpointer）+ 长期记忆（store）+ 多租户表的持久化后端
  postgres:
    image: postgres:16-alpine
    container_name: agentforge-postgres
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_pass
      POSTGRES_DB: agent_memory
    ports:
      - "5432:5432"
    volumes:
      - agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_memory"]
      interval: 5s
      timeout: 3s
      retries: 10

  # FastAPI 后端：纯 API 服务（不再托管前端静态页）
  backend:
    build: ./backend
    container_name: agentforge-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agent:agent_pass@postgres:5432/agent_memory
      MODEL: ${MODEL:-anthropic:claude-sonnet-4-6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENSANDBOX_DOMAIN: ${OPENSANDBOX_DOMAIN:-host.docker.internal:8080}
      OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:-local-dev-key}
      OPENSANDBOX_IMAGE: ${OPENSANDBOX_IMAGE:-python:3.11-slim}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SKILLS_DIR: ${SKILLS_DIR:-skills}
      SANDBOX_MODE: ${SANDBOX_MODE:-shared}
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8080,http://frontend"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/skills:/app/skills
      - ./backend/.env:/app/.env:ro

  # 前端：Vite + Vue3 + TS，构建后由 nginx 托管 + 反代 /api
  frontend:
    build: ./frontend
    container_name: agentforge-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

  # OpenSandbox 服务端（可选）：
  # 服务端需要访问宿主机 Docker daemon 来创建沙箱容器，
  # Windows/macOS 下建议直接在宿主机运行：
  #   uvx opensandbox-server init-config sandbox.toml --example docker
  #   uvx opensandbox-server
  # Linux 下可取消注释以下配置（需挂载 /var/run/docker.sock）
  # opensandbox:
  #   image: opensandbox/opensandbox-server:latest
  #   container_name: agent-opensandbox
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - ./sandbox.toml:/root/.sandbox.toml

volumes:
  agent_pgdata:
